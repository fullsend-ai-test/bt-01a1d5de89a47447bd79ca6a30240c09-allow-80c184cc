# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
tracker:
    github:
        allowed_targets:
            repos:
                - fullsend-ai/fullsend
                - fullsend-ai/agents
runtime: dummy
agents:
    - name: do-needs-triage
      source: harness/do-needs-triage.yaml
    - name: do-needs-write
      source: harness/do-needs-write.yaml
    - name: do-on-label
      source: harness/do-on-label.yaml
    - name: fork-auth-probe
      source: harness/fork-auth-probe.yaml
mint_url: https://bt-9f892f82-bt-mint.fullsend-ai.workers.dev
